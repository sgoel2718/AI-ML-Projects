# Publishes TextPulse to a free Hugging Face static Space every time its code changes.
# The models run in the visitor's browser (app/static/engine.js), so the Space
# needs no server: it is free and never goes to sleep.
# One-time setup: textpulse/docs/DEPLOY.md

name: Deploy TextPulse to Hugging Face

on:
  push:
    branches: [main]
    paths:
      - "textpulse/app/static/**"
      - "textpulse/deploy/browser/**"
      - ".github/workflows/deploy-textpulse.yml"
  workflow_dispatch:        # adds a "Run workflow" button in the Actions tab

# If two pushes happen close together, only deploy the newest one
concurrency:
  group: deploy-textpulse
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}   # a Hugging Face write token (kept secret)
      HF_SPACE: ${{ vars.HF_SPACE }}      # e.g. your-username/textpulse
    steps:
      - name: Check the settings exist
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE" ]; then
            echo "::error::Add the HF_TOKEN secret and the HF_SPACE variable. See textpulse/docs/DEPLOY.md"
            exit 1
          fi

      - name: Get the code
        uses: actions/checkout@v4

      - name: Put the Space together
        run: |
          mkdir -p space/static
          # The dashboard files
          cp -r textpulse/app/static/. space/static/
          mv space/static/index.html space/index.html
          # Static hosting: use relative paths, and load the in-browser engine before app.js
          sed -i 's#"/static/#"static/#g' space/index.html
          sed -i 's#<script src="static/app.js"></script>#<script src="static/engine.js"></script>\n  <script src="static/app.js"></script>#' space/index.html
          grep -q 'static/engine.js' space/index.html || { echo "::error::Could not add engine.js to index.html"; exit 1; }
          # The exported models, test messages and scores (scripts/export_for_browser.py)
          cp -r textpulse/deploy/browser/data space/data
          # The Space's settings (sdk: static) and description
          cp textpulse/deploy/browser/SPACE_README.md space/README.md
          find space -type f | sort

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upload to Hugging Face
        run: |
          pip install --quiet "huggingface_hub>=0.25"
          python - <<'EOF'
          import os
          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])
          space = os.environ["HF_SPACE"]

          # Creates the Space the first time; does nothing if it already exists
          api.create_repo(space, repo_type="space", space_sdk="static", exist_ok=True)

          # Upload everything. Old files that no longer exist here are removed.
          api.upload_folder(
              folder_path="space",
              repo_id=space,
              repo_type="space",
              commit_message=f"Deploy from GitHub {os.environ['GITHUB_SHA'][:7]}",
              delete_patterns=["*", "**/*"],
          )
          host = space.lower().replace("/", "-").replace("_", "-").replace(".", "-")
          print(f"Deployed. Space page: https://huggingface.co/spaces/{space}")
          print(f"Live app: https://{host}.static.hf.space")
          EOF
