# Keeps the TextPulse Space awake and running.
# Free Hugging Face Spaces sleep after 48 hours without visitors. Every 6 hours
# this visits the app, and if the Space has stopped for any reason, restarts it.

name: Keep TextPulse awake

on:
  schedule:
    - cron: "17 */6 * * *"   # 00:17, 06:17, 12:17 and 18:17 UTC every day
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE: ${{ vars.HF_SPACE }}
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Wake or restart the Space if needed, then visit it
        run: |
          if [ -z "$HF_SPACE" ]; then
            echo "HF_SPACE is not set yet, nothing to check."
            exit 0
          fi
          pip install --quiet "huggingface_hub>=0.25"
          python - <<'EOF'
          import os, time, urllib.request
          from huggingface_hub import HfApi

          space = os.environ["HF_SPACE"]
          api = HfApi(token=os.environ.get("HF_TOKEN") or None)
          host = space.lower().replace("/", "-").replace("_", "-").replace(".", "-")
          url = f"https://{host}.hf.space/api/status"

          stage = api.get_space_runtime(space).stage
          print(f"Space stage: {stage}")
          if stage in ("SLEEPING", "STOPPED", "RUNTIME_ERROR") and os.environ.get("HF_TOKEN"):
              print("Restarting the Space...")
              api.restart_space(space)

          # Visit the app; it can take a few minutes to come back after a restart
          for attempt in range(1, 11):
              try:
                  with urllib.request.urlopen(url, timeout=60) as response:
                      print(f"Attempt {attempt}: HTTP {response.status}, the app is live at https://{host}.hf.space")
                      break
              except Exception as error:
                  print(f"Attempt {attempt}: not ready yet ({error})")
                  time.sleep(60)
          else:
              raise SystemExit("The app did not answer after 10 minutes. Check the Space's Logs tab.")
          EOF
