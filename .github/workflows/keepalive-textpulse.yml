# Checks once a day that the live TextPulse site answers.
# Static Spaces never sleep, so this is only a health check: if the site is
# down, the run fails and GitHub emails you.

name: Check TextPulse is live

on:
  schedule:
    - cron: "17 6 * * *"   # 06:17 UTC (11:47 India time) every day
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      HF_SPACE: ${{ vars.HF_SPACE }}
    steps:
      - name: Visit the site and its model files
        run: |
          if [ -z "$HF_SPACE" ]; then
            echo "HF_SPACE is not set yet, nothing to check."
            exit 0
          fi
          host=$(echo "$HF_SPACE" | tr 'A-Z' 'a-z' | tr '/_.' '---')
          for path in "" "static/engine.js" "data/metrics.json" "data/spam_model.json.gz"; do
            url="https://$host.static.hf.space/$path"
            code=$(curl -sL -o /dev/null -w "%{http_code}" --retry 3 --retry-delay 20 "$url")
            echo "$code  $url"
            [ "$code" = "200" ] || { echo "::error::$url answered $code. Check the Space page on Hugging Face."; exit 1; }
          done
          echo "TextPulse is live at https://$host.static.hf.space"
